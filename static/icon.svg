  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="112" y="163" width="288" height="162" rx="16" fill="#26324d" stroke="#7d8fb5" stroke-width="10"/>
  <g stroke="#0b0d10" stroke-width="8">
    <circle cx="256.0" cy="86.0" r="58" fill="#f3ecd0"/>
    <circle cx="417.7" cy="203.5" r="58" fill="#2f7fd0"/>
    <circle cx="355.9" cy="393.5" r="58" fill="#1d1917" stroke="#a89f96"/>
