<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
  <!-- The pod seated around the TV scoreboard (16:9): two on each long side, one at each end.
       Pips are shaded like the five spheres on the classic card back.
       Full-bleed so home screens can round the corners. -->
  <defs>
    <radialGradient id="bg" cx="85%" cy="0%" r="110%">
      <stop offset="0" stop-color="#1f2a40"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </radialGradient>
    <!-- Light from the upper right, matching the background: a bright spot, then darkening toward the far edge. -->
    <radialGradient id="shade" cx=".58" cy=".38" r=".66" fx=".68" fy=".26">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset=".14" stop-color="#fff" stop-opacity=".45"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".8" stop-color="#000" stop-opacity=".2"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
    <circle id="pip" r="46"/>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="104" y="170.5" width="304" height="171" rx="16" fill="#26324d" stroke="#7d8fb5" stroke-width="10"/>
  <g id="pips">
    <use xlink:href="#pip" x="176" y="140.5" fill="#efe6c4"/>
    <use xlink:href="#pip" x="336" y="140.5" fill="#2f8ad6"/>
    <use xlink:href="#pip" x="438" y="256" fill="#3a2f3c"/>
    <use xlink:href="#pip" x="336" y="371.5" fill="#d8392a"/>
    <use xlink:href="#pip" x="176" y="371.5" fill="#3aa257"/>
    <use xlink:href="#pip" x="74" y="256" fill="#b9b3ad"/>
  </g>
  <g fill="url(#shade)" stroke="#000" stroke-width="3">
    <use xlink:href="#pip" x="176" y="140.5"/>
    <use xlink:href="#pip" x="336" y="140.5"/>
    <use xlink:href="#pip" x="438" y="256"/>
    <use xlink:href="#pip" x="336" y="371.5"/>
    <use xlink:href="#pip" x="176" y="371.5"/>
    <use xlink:href="#pip" x="74" y="256"/>
  </g>
</svg>
